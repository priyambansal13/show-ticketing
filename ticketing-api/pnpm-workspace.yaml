# Only these dependencies may run install scripts (pnpm blocks all others by default).
allowBuilds:
  "@prisma/engines": true
  prisma: true
  argon2: true
  esbuild: true
  # optional native speedup for ssh2 (pulled in by testcontainers); not needed
  cpu-features: false
  # testcontainers transitive deps — install scripts not required
  protobufjs: false
  ssh2: false
  # install-time telemetry from swagger-ui-dist — never allowed
  "@scarf/scarf": false
  # optional native msgpack speedup for bullmq; pure-JS fallback is used
  msgpackr-extract: false
